apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing: read keystore.properties (local, git-ignored) or the CI environment variables.
// No password is ever stored in the repository.
def releaseKeystoreProps = new java.util.Properties()
def releaseKeystoreFile = rootProject.file('keystore.properties')
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystoreProps.load(it) }
}
def releaseSigningStore = rootProject.file(releaseKeystoreProps['storeFile'] ?: 'xiaoyinghe.jks')
def releaseKeyAlias = System.getenv('XYH_KEY_ALIAS') ?: releaseKeystoreProps['keyAlias']
def releaseKeyPassword = System.getenv('XYH_KEY_PASSWORD') ?: releaseKeystoreProps['keyPassword']
def releaseStorePassword = System.getenv('XYH_STORE_PASSWORD') ?: releaseKeystoreProps['storePassword']

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningStore.exists()) {
            throw new GradleException("Release requires ${releaseSigningStore.name} plus signing credentials (keystore.properties or XYH_* variables). Use assembleDebug for local development.")
        }
        if (!releaseKeyAlias || !releaseKeyPassword || !releaseStorePassword) {
            throw new GradleException('Release signing credentials are missing. Fill keystore.properties or set XYH_KEY_ALIAS / XYH_KEY_PASSWORD / XYH_STORE_PASSWORD.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn(verifyReleaseSigning)
}

android {
    namespace 'com.xiaoyinghe.tv'
    compileSdkVersion 34
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    defaultConfig {
        applicationId 'com.xiaoyinghe.tv'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName '1.0.2'
        multiDexEnabled true
        testInstrumentationRunner 'com.xiaoyinghe.tv.RegressionTestRunner'
        // 你的项目地址：同时决定“应用内更新”和“关于页-项目地址”。
        // 改 gradle.properties 里的 project.owner / project.repo 即可，无需改代码。
        buildConfigField "String", "PROJECT_OWNER", '"' + (project.findProperty('project.owner') ?: 'YOUR_GITHUB_USER') + '"'
        buildConfigField "String", "PROJECT_REPO", '"' + (project.findProperty('project.repo') ?: 'xiaoyinghe') + '"'
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = 'xiaoyinghe-v' + variant.versionName + '.apk'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    signingConfigs {
        config {
            if (releaseSigningStore.exists()) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile releaseSigningStore
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (releaseSigningStore.exists()) {
                signingConfig signingConfigs.config
            }
        }

        release {
            if (releaseSigningStore.exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {//引入dlna-cast时的文件冲突
        exclude 'META-INF/beans.xml'
    }
}

def generatedNotes = layout.buildDirectory.dir('generated/releaseNotes')
android.sourceSets.main.assets.srcDir(generatedNotes)
def generateReleaseNotes = tasks.register('generateReleaseNotes') {
    def notesSource = rootProject.file('README.md')
    inputs.property('versionName', android.defaultConfig.versionName)
    inputs.files(notesSource)
    outputs.dir(generatedNotes)
    doLast {
        def directory = generatedNotes.get().asFile
        directory.mkdirs()
        def entry = notesSource.exists() ? notesSource.readLines('UTF-8').find { line ->
            line.contains("小影盒 v${android.defaultConfig.versionName}：")
        } : null
        def notes = entry ? "小影盒 ${android.defaultConfig.versionName}\n\n${entry.replaceFirst('^>\\*\\s*', '')}" : "小影盒 ${android.defaultConfig.versionName}\n功能改进与问题修复。详细记录可通过项目地址查看。"
        new File(directory, 'release-notes.txt').setText(notes.replaceAll('(?m)^#+ ', '').replace('**', '').replace('`', ''), 'UTF-8')
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) task.dependsOn(generateReleaseNotes)
}

